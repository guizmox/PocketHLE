[package]
name = "pocket-netcf"
version.workspace = true
edition = "2021"
license = "Apache-2.0 OR MIT"

[dependencies]
log.workspace = true
pocket-kernel = { path = "../pocket-kernel", default-features = false }
pocket-gles = { path = "../pocket-gles" }
image = { version = "0.24", default-features = false, features = ["png", "bmp", "jpeg"] }
pocket-cab = { path = "../pocket-cab" }
quick-xml = "0.39"
tempfile = "3"

serde.workspace = true
serde_bytes.workspace = true
pocket-snapshot = { path = "../pocket-snapshot" }
sha2 = "0.11"

[dev-dependencies]
bincode = "1.3"
