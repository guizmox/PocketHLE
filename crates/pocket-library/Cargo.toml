[package]
name = "pocket-library"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Game library / configuration management for PocketHLE GUI frontends."

[features]
steam-deck = []
release-updates = ["dep:ureq", "dep:rustls", "dep:rustls-native-certs", "dep:webpki-roots"]

[dependencies]
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
semver = "1"
ureq = { version = "2.12", optional = true, default-features = false, features = ["tls"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["std", "ring", "tls12"] }
rustls-native-certs = { version = "0.7", optional = true }
webpki-roots = { version = "0.26", optional = true }
thiserror.workspace = true
directories = "5"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
rars = "0.4.9"
newtua-nsis = "0.1.1"
flate2.workspace = true
md5 = "0.7"
cab.workspace = true

pocket-cab = { path = "../pocket-cab" }
pocket-pe = { path = "../pocket-pe" }
png = "0.17"
image = { version = "0.25", default-features = false, features = ["bmp", "png"] }

tempfile = "3"
