name: Android APK
on:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - run: sudo apt-get update && sudo apt-get install -y cmake pkg-config make curl unzip python3
      - run: cargo install cargo-ndk --version 3.5.4 --locked
      - run: bash tools/build-android-native.sh 4
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
      - name: prepare stable Android signing
        shell: bash
        env:
          POCKETHLE_KEYSTORE_BASE64: ${{ secrets.POCKETHLE_KEYSTORE_BASE64 }}
          POCKETHLE_KEYSTORE_PASSWORD: ${{ secrets.POCKETHLE_KEYSTORE_PASSWORD }}
          POCKETHLE_KEY_ALIAS: ${{ secrets.POCKETHLE_KEY_ALIAS }}
          POCKETHLE_KEY_PASSWORD: ${{ secrets.POCKETHLE_KEY_PASSWORD }}
        run: bash tools/prepare-android-signing.sh
      - run: bash tools/build-android-apk.sh
        env:
          POCKETHLE_KEYSTORE_PASSWORD: ${{ secrets.POCKETHLE_KEYSTORE_PASSWORD }}
          POCKETHLE_KEY_ALIAS: ${{ secrets.POCKETHLE_KEY_ALIAS }}
          POCKETHLE_KEY_PASSWORD: ${{ secrets.POCKETHLE_KEY_PASSWORD }}
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
      - uses: actions/upload-artifact@v4
        with:
          name: PocketHLE-Android
          path: dist/android/PocketHLE-*.apk
