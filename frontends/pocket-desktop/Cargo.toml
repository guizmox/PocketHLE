[package]
name = "pocket-desktop"
default-run = "pockethle-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Cross-platform desktop launcher GUI for PocketHLE (Linux + Windows)."

[[bin]]
name = "pockethle-gui"
path = "src/main.rs"

[[example]]
name = "hardware-diag-bluetooth-host"
path = "../../tools/hardware-diag/suites/bluetooth/host-radio.rs"

[features]
# Default builds include the real ARM CPU (unicorn-engine) and
# real-time audio (cpal). Without `unicorn` the stub CPU is
# trace-only and cannot actually run a game; without `audio-cpal`
# all `waveOut*` traffic is silently discarded. Disable with
# `--no-default-features` to omit emulator-native features (SDL3 still builds through CMake).
default = ["unicorn", "audio-cpal", "video-static"]
unicorn = ["pocket-core/unicorn"]
audio-cpal = ["pocket-core/audio-cpal"]

video-static = ["pocket-core/video-static"]

[dependencies]
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true

eframe = { version = "0.27", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.27"
egui_extras = { version = "0.27", features = ["image"] }
# Native message fallback for startup errors / Windows command-line help.
# Library file pickers and confirmations are owned by egui, not rfd.
# GTK3 is synchronous; the xdg-portal backend needs a Tokio reactor.
rfd = { version = "0.14", default-features = false, features = ["gtk3"] }
directories = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

pocket-core = { path = "../../crates/pocket-core" }
pocket-library = { path = "../../crates/pocket-library", features = ["release-updates"] }
pocket-pe = { path = "../../crates/pocket-pe" }

xbrz-rs = "=0.1.0"

sdl3 = { version = "=0.22.0", features = ["build-from-source-static"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = ["implement", "ApplicationModel_DataTransfer", "Foundation", "Foundation_Collections", "Storage", "Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[build-dependencies]
winres = "0.1.12"

[dev-dependencies]
pocket-gles = { path = "../../crates/pocket-gles" }
